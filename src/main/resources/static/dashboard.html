<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Dashboard - Coffee Recipe Organizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/theme-config.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%232A1B12' d='M2,21V19H20V21H2M20,8V5L18,5V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z'/></svg>">
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <svg width="40" height="40" viewBox="0 0 72 72" fill="none" class="mx-auto mb-4 text-amber-600">
                <path d="M28 14c-3 3-3 6 0 9s3 6 0 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
                <path d="M36 12c-3 3-3 6 0 9s3 6 0 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
                <path d="M44 14c-3 3-3 6 0 9s3 6 0 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
                <path d="M14 38 H58" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                <path d="M18 38 H54 L36 58 Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                <path d="M20 58 H52 L48 66 H24 Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
            </svg>
            <p class="text-xs font-semibold text-amber-600 tracking-widest uppercase mb-2">Coffee Recipe Organizer</p>
            <h1 class="text-3xl text-amber-900" id="welcome-msg">Dashboard</h1>
            <p class="text-amber-700 text-sm mt-2">What would you like to do?</p>
        </div>

        <div class="bg-white border border-amber-200 rounded divide-y divide-amber-200 overflow-hidden">
            <a href="/create-recipe.html" class="block p-4 bg-amber-800 hover:bg-amber-900 transition duration-200">
                <div class="font-semibold text-white text-sm">Create Recipe</div>
                <div class="text-xs text-amber-100">Build something new</div>
            </a>
            <a href="/my-recipes.html" class="block p-4 hover:bg-amber-50 transition duration-200">
                <div class="font-semibold text-amber-900 text-sm">My Recipes</div>
                <div class="text-xs text-amber-700">Manage your personal collection</div>
            </a>
            <a href="/public-recipes.html" class="block p-4 hover:bg-amber-50 transition duration-200">
                <div class="font-semibold text-amber-900 text-sm">Public Recipes</div>
                <div class="text-xs text-amber-700">Browse the community</div>
            </a>
            <a href="/shared-with-me.html" class="block p-4 hover:bg-amber-50 transition duration-200">
                <div class="font-semibold text-amber-900 text-sm">Shared with Me</div>
                <div class="text-xs text-amber-700">Recipes others have shared</div>
            </a>
        </div>

        <div class="pt-6 text-center">
            <a href="/logout" class="text-sm text-red-600 hover:text-red-700 font-medium transition duration-200">Sign out</a>
        </div>
    </div>

    <script>
        fetch('/api/user/profile', { credentials: 'include' })
            .then(r => r.json())
            .then(data => {
                if (data.username) {
                    document.getElementById('welcome-msg').textContent = 'Welcome back, ' + data.username;
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
