<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Coffee Recipe Organizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/theme-config.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm text-center">
        <p class="text-xs font-semibold text-amber-600 tracking-widest uppercase mb-2">Coffee Recipe Organizer</p>
        <h1 class="text-3xl text-red-700 mb-4">Something went wrong</h1>

        <p class="text-amber-800 mb-8 text-sm leading-relaxed">
            We're sorry, something unexpected happened. Try again or head back to the homepage.
        </p>

        <div class="space-y-3">
            <a href="/"
               class="block w-full bg-amber-800 hover:bg-amber-900 text-white font-semibold py-3 px-4 rounded transition duration-200">
                Go Home
            </a>
            <button onclick="history.back()"
                    class="block w-full bg-transparent hover:bg-amber-100 text-amber-900 font-semibold py-3 px-4 rounded border border-amber-300 transition duration-200">
                Go Back
            </button>
        </div>
    </div>
</body>
</html>
