<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coffee Recipe Organizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/theme-config.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%232A1B12' d='M2,21V19H20V21H2M20,8V5L18,5V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z'/></svg>">
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <svg width="40" height="40" viewBox="0 0 72 72" fill="none" class="mx-auto mb-4 text-amber-600">
                <path d="M28 14c-3 3-3 6 0 9s3 6 0 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
                <path d="M36 12c-3 3-3 6 0 9s3 6 0 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
                <path d="M44 14c-3 3-3 6 0 9s3 6 0 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
                <path d="M14 38 H58" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                <path d="M18 38 H54 L36 58 Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                <path d="M20 58 H52 L48 66 H24 Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
            </svg>
            <p class="text-xs font-semibold text-amber-600 tracking-widest uppercase mb-2">Coffee Recipe Organizer</p>
            <h1 class="text-3xl text-amber-900">Welcome back</h1>
        </div>

        <div class="bg-white border border-amber-200 rounded p-6">
            <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded hidden text-sm"
                 id="error-message">
                Invalid username or password. Please try again.
            </div>

            <form action="/login" class="space-y-4" method="post">
                <div>
                    <label class="block text-sm font-medium text-amber-900 mb-1" for="username">
                        Username
                    </label>
                    <input type="text"
                           id="username"
                           name="username"
                           autocomplete="username"
                           required
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition duration-200 text-sm"
                           placeholder="Enter your username" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-amber-900 mb-1" for="password">
                        Password
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           required
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition duration-200 text-sm"
                           placeholder="Enter your password" />
                </div>

                <button type="submit"
                        class="w-full bg-amber-800 hover:bg-amber-900 text-white font-semibold py-2 px-4 rounded transition duration-200 text-sm">
                    Sign In
                </button>
            </form>
        </div>

        <p class="mt-6 text-center text-sm text-amber-700">
            Don't have an account? <a class="font-semibold underline hover:text-amber-900" href="/auth/register">Create one here</a>
        </p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'true') {
            document.getElementById('error-message').classList.remove('hidden');
        }
    </script>
</body>
</html>
